[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contact4d"
version = "0.1.0"
description = "Tools for consuming the Contact4D egocentric+exocentric dataset: 2D projection, camera-space conversion, mesh visualization, undistortion."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "torch>=2.0",
    "smplx>=0.1.28",
]

[project.optional-dependencies]
render = ["pyrender>=0.1.45", "trimesh>=4.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["contact4d*"]
